services:
  # 1. Node/Express Backend API Service
  - type: web
    name: pulse-uptime-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    rootDir: backend
    envVars:
      - key: MONGO_URI
        sync: false # Render will prompt you for this value on deployment
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # 2. Vite React Frontend (Served as Static Site)
  - type: web
    name: pulse-uptime-dashboard
    env: static
    plan: free
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromRoute:
          type: web
          name: pulse-uptime-api
